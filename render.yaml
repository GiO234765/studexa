services:
  - type: web
    name: studexa-beta
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: VITE_BETA_SUPPORT_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ENABLED
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: BETA_REGISTRATION_OPEN
        value: "true"
